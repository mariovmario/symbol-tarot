<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="An original three-card symbol reading for reflection." />
  <title>Symbol Tarot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">Original Symbol Deck</p>
      <h1>Symbol Tarot</h1>
      <p class="intro">A three-card story for reflection: what shaped you, what is asking for attention now, and a possible path forward.</p>
    </header>

    <section class="controls" aria-label="Reading controls">
      <label for="topic">Choose a focus</label>
      <select id="topic">
        <option value="personal growth">Personal growth</option>
        <option value="love and connection">Love and connection</option>
        <option value="money and work">Money and work</option>
        <option value="future path">Future path</option>
        <option value="wisdom">Wisdom</option>
      </select>
      <button id="draw-button" type="button">Draw Your Three Cards</button>
    </section>

    <p id="instruction" class="instruction">Choose a focus, then draw your three-card story.</p>
    <section id="spread" class="spread" aria-live="polite"></section>
    <section id="story" class="story" hidden></section>

    <button id="reset-button" class="text-button" type="button">Start a new journey</button>
    <p class="note">For reflection and entertainment; this experience does not predict or guarantee outcomes.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
